<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4A90E2">
<title>📅 Моё расписание</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #4A90E2;
    font-size: 24px;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  input, button {
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid #e0e0e0;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #4A90E2; }
  button {
    background: #4A90E2;
    color: #fff;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s;
  }
  button:hover { background: #357ABD; }
  button:active { transform: scale(0.98); }
  button.secondary {
    background: #e74c3c;
    padding: 8px 12px;
    font-size: 14px;
  }
  button.secondary:hover { background: #c0392b; }
  .notif-btn {
    background: #27ae60;
    margin-bottom: 20px;
    width: 100%;
  }
  .notif-btn:hover { background: #229954; }
  .notif-btn.enabled { background: #95a5a6; }

  .events-list { list-style: none; }
  .event-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px;
    background: #f8f9fa;
    border-left: 4px solid #4A90E2;
    border-radius: 8px;
    margin-bottom: 10px;
    transition: 0.2s;
  }
  .event-item.past { opacity: 0.5; border-left-color: #95a5a6; }
  .event-item.upcoming { border-left-color: #27ae60; }
  .event-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .event-time {
    font-weight: 700;
    color: #4A90E2;
    font-size: 18px;
  }
  .event-title {
    font-size: 15px;
    color: #333;
  }
  .empty {
    text-align: center;
    color: #999;
    padding: 30px 10px;
    font-style: italic;
  }
  .status {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📅 Моё расписание</h1>

  <button class="notif-btn" id="notifBtn">🔔 Включить уведомления</button>
  <div class="status" id="status"></div>

  <div class="input-group">
    <input type="time" id="timeInput">
    <input type="text" id="titleInput" placeholder="Название события (напр. Встреча)">
    <button id="addBtn">➕ Добавить событие</button>
  </div>

  <ul class="events-list" id="eventsList"></ul>
</div>

<script>
// ==== ХРАНИЛИЩЕ ====
let events = JSON.parse(localStorage.getItem('schedule_events') || '[]');
const notified = new Set(JSON.parse(localStorage.getItem('schedule_notified') || '[]'));

// ==== УВЕДОМЛЕНИЯ ====
const notifBtn = document.getElementById('notifBtn');
const statusEl = document.getElementById('status');

function updateNotifButton() {
  if (!('Notification' in window)) {
    notifBtn.textContent = '❌ Уведомления не поддерживаются';
    notifBtn.disabled = true;
    return;
  }
  if (Notification.permission === 'granted') {
    notifBtn.textContent = '✅ Уведомления включены';
    notifBtn.classList.add('enabled');
    statusEl.textContent = 'Вы получите уведомление в момент события';
  } else if (Notification.permission === 'denied') {
    notifBtn.textContent = '🚫 Уведомления заблокированы';
    notifBtn.classList.add('enabled');
    statusEl.textContent = 'Разрешите уведомления в настройках браузера';
  } else {
    notifBtn.textContent = '🔔 Включить уведомления';
    notifBtn.classList.remove('enabled');
  }
}

notifBtn.addEventListener('click', async () => {
  if (!('Notification' in window)) return alert('Ваш браузер не поддерживает уведомления');
  const perm = await Notification.requestPermission();
  updateNotifButton();
  if (perm === 'granted') {
    new Notification('Уведомления включены ✅', { body: 'Теперь вы получите напоминания о событиях' });
  }
});

// ==== РЕНДЕР ====
function render() {
  const list = document.getElementById('eventsList');
  list.innerHTML = '';
  if (events.length === 0) {
    list.innerHTML = '<li class="empty">Пока нет событий. Добавьте первое!</li>';
    return;
  }
  const sorted = [...events].sort((a, b) => a.time.localeCompare(b.time));
  const now = new Date();
  const nowStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

  sorted.forEach(ev => {
    const li = document.createElement('li');
    li.className = 'event-item ' + (ev.time < nowStr ? 'past' : 'upcoming');
    li.innerHTML = `
      <div class="event-info">
        <span class="event-time">${ev.time}</span>
        <span class="event-title">${escapeHtml(ev.title)}</span>
      </div>
      <button class="secondary" onclick="removeEvent('${ev.id}')">Удалить</button>
    `;
    list.appendChild(li);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ==== ДОБАВЛЕНИЕ ====
document.getElementById('addBtn').addEventListener('click', () => {
  const time = document.getElementById('timeInput').value;
  const title = document.getElementById('titleInput').value.trim();
  if (!time || !title) return alert('Заполните время и название');
  events.push({ id: Date.now().toString(), time, title });
  save();
  document.getElementById('timeInput').value = '';
  document.getElementById('titleInput').value = '';
  render();
});

function removeEvent(id) {
  events = events.filter(e => e.id !== id);
  save();
  render();
}

function save() {
  localStorage.setItem('schedule_events', JSON.stringify(events));
  localStorage.setItem('schedule_notified', JSON.stringify([...notified]));
}

// ==== ПРОВЕРКА ВРЕМЕНИ (каждые 30 секунд) ====
function checkEvents() {
  if (Notification.permission !== 'granted') return;
  const now = new Date();
  const hh = now.getHours().toString().padStart(2,'0');
  const mm = now.getMinutes().toString().padStart(2,'0');
  const nowStr = `${hh}:${mm}`;
  const today = now.toDateString();

  events.forEach(ev => {
    const key = `${today}_${ev.id}_${ev.time}`;
    if (ev.time === nowStr && !notified.has(key)) {
      new Notification('⏰ Событие сейчас!', {
        body: `${ev.time} — ${ev.title}`,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">⏰</text></svg>',
        tag: key
      });
      notified.add(key);
      save();
    }
  });

  // очистка старых ключей (не сегодня)
  for (const k of notified) {
    if (!k.startsWith(today)) notified.delete(k);
  }
}

// ==== ИНИЦИАЛИЗАЦИЯ ====
updateNotifButton();
render();
setInterval(checkEvents, 30000);
// Также проверяем при возврате на вкладку
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkEvents();
});
</script>
</body>
</html>
